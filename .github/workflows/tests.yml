name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write      # push to gh-pages branch
  checks: write        # allure-action GitHub Checks
  pull-requests: write # PR comments

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel cleanup runs when a PR is closed
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  # ─────────────────────────────────────────────
  # Main: run tests, publish report, post comment
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    if: github.event.action != 'closed'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        run: yarn test
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: yarn allure:generate

      # Compute the target subdirectory and its public URL
      - name: Compute report path
        id: report
        if: always()
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIR="pr-${{ github.event.pull_request.number }}"
          else
            DIR="main"
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "url=https://${OWNER}.github.io/${REPO}/${DIR}/" >> "$GITHUB_OUTPUT"

      # Deploy to gh-pages branch under the computed subdirectory.
      # keep_files: true — doesn't wipe other PR/main directories.
      - name: Deploy to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ${{ steps.report.outputs.dir }}
          keep_files: true

      # GitHub Check + formatted stats comment in PR (allure-action)
      - name: Post Allure summary
        if: always()
        uses: allure-framework/allure-action@v0.7.0
        with:
          report-directory: allure-report
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Separate comment with direct Pages link (created once, updated on re-run)
      - name: Post Pages link to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.report.outputs.url }}';
            const marker = '<!-- allure-pages-link -->';
            const body = `${marker}\n📊 **Full Allure report on GitHub Pages:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Assert test outcome
        if: always()
        run: |
          if [ "${{ steps.playwright.outcome }}" = "failure" ]; then
            echo "Tests failed. Report: ${{ steps.report.outputs.url }}"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # Cleanup: remove PR directory from gh-pages
  # when the PR is merged or closed
  # ─────────────────────────────────────────────
  cleanup:
    name: Remove PR report from gh-pages
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Delete PR report directory
        run: |
          PR_DIR="pr-${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "chore: remove Allure report for PR #${{ github.event.pull_request.number }}"
            git push
          else
            echo "Nothing to clean up for $PR_DIR"
          fi
